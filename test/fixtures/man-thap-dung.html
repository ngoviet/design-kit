<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanh dính gọn</title>
<link rel="manifest" href="khong-khoa.webmanifest">
<style>
body { margin: 0; font: 400 1rem/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
main { padding: 24px 16px; max-width: 40rem; }
header { position: sticky; top: 0; height: 56px; background: #eef; }
.ben { position: fixed; top: 56px; left: 0; width: 160px; bottom: 0; background: #f4f4ff; }
.thong-bao { position: fixed; left: 0; right: 0; bottom: 0; height: 300px; }
.trang-tri { position: fixed; inset: 0; z-index: -1; background: linear-gradient(#fff, #f6f6ff); }
.chua-dinh { position: sticky; top: 0; height: 320px; background: #eee; }
main { min-height: 2400px; margin-left: 160px; }
main .xa { margin-top: 1800px; }
@media (max-width: 600px) { .ben { display: none; } main { margin-left: 0; } }
</style>
</head>
<body>
<div class="trang-tri" aria-hidden="true"></div>
<header><p>Đầu trang</p></header>
<nav class="ben" aria-label="Chính"><p>Cột bên hẹp, không phải thanh ngang</p></nav>
<main><h1>Danh sách dài</h1><p>Chỉ đầu trang dính.</p><div class="xa"><div class="chua-dinh"><p>Khối cao dính ở cuối trang, lúc đo chưa dính.</p></div></div></main>
<div class="thong-bao" role="status"></div>
</body>
</html>
