<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiệu ứng vô hạn trong shadow DOM</title>
<style>body { margin: 0; font: 400 16px/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; } main { padding: 32px 16px; }</style>
</head>
<body>
  <main>
    <h1>Thẻ đang tải</h1>
    <the-xoay></the-xoay>
  </main>
  <script>
    // Thẻ web component có vòng xoay vô hạn, không tôn trọng prefers-reduced-motion. document.getAnimations() của
    // Chromium không thấy nó, nên phép đo motion cứng từng bỏ qua.
    customElements.define("the-xoay", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML = `<style>
          .v { width: 32px; height: 32px; border: 4px solid #444; border-top-color: transparent; border-radius: 50%; animation: xoay 1s linear infinite; }
          @keyframes xoay { to { transform: rotate(1turn); } }
        </style><div class="v" role="img" aria-label="Đang tải"></div><p>Đang tải dữ liệu</p>`;
      }
    });
  </script>
</body>
</html>
