<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mất dấu trong màu ép buộc</title>
<style>
body { margin: 0; font: 400 1rem/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
main { padding: 24px 16px; max-width: 40rem; display: grid; gap: 16px; justify-items: start; }
button, input { font: inherit; min-height: 44px; border: 0; padding: 0 16px; }
.nen { background: #0b57d0; color: #fff; }
.dai { background: linear-gradient(#0b57d0, #062e6f); color: #fff; }
.bong { background: #fff; box-shadow: 0 1px 4px rgb(0 0 0 / 0.4); }
.o-nen { background: #e8eaed; }
.the { display: block; padding: 16px; background: #f1f3f4; color: inherit; text-decoration: none; border-radius: 8px; }
.gia { position: relative; background: none; isolation: isolate; }
.gia::before { content: ""; position: absolute; inset: 0; background: #cfe2ff; z-index: -1; }
.hang { display: flex; gap: 8px; }
.muc { background: #f1f3f4; color: #1a1a1a; border-bottom: 2px solid transparent; }
.muc[aria-selected="true"] { background: #0b57d0; color: #fff; border-bottom-color: #062e6f; }
nav a { display: block; padding: 8px 12px; color: #1a1a1a; text-decoration: none; border: 1px solid #ccc; }
nav a[aria-current] { background: #0b57d0; color: #fff; }
.loc { border: 1px solid #777; background: #fff; }
.loc[aria-pressed="true"] { background: #cfe2ff; }
.the-boc { display: block; color: inherit; text-decoration: none; }
.the-boc > div { padding: 16px; background: #f1f3f4; }
.vet { position: absolute; left: 0; bottom: 0; width: 64px; height: 3px; background: #0b57d0; }
.tab-vet { width: 64px; background: #fff; }
.tab-vet[aria-selected="true"] { color: #0b57d0; }
</style>
</head>
<body>
<main>
<h1>Màu ép buộc</h1>
<button type="button" class="nen" id="nut-nen">Lưu</button>
<button type="button" class="dai" id="nut-dai">Gửi</button>
<button type="button" class="bong" id="nut-bong">Huỷ</button>
<button type="button" class="gia" id="nut-gia">Vẽ bằng phần tử giả</button>
<input class="o-nen" id="o-nen" aria-label="Tên">
<a class="the" href="#the" id="the"><strong>Thẻ bấm được</strong><br>Mô tả ngắn</a>
<a class="the-boc" href="#boc" id="the-boc"><div>Liên kết bọc cả thẻ</div></a>
<div role="tablist" aria-label="Khoảng" class="hang"><button type="button" role="tab" aria-selected="true" class="muc" id="tab-1">Ngày</button><button type="button" role="tab" aria-selected="false" class="muc">Tuần</button></div>
<nav aria-label="Chính"><a href="#1" aria-current="page" id="dang-xem">Tổng quan</a><a href="#2">Thiết bị</a><a href="#3">Cảnh báo</a></nav>
<div class="hang"><button type="button" class="loc" aria-pressed="false">Tất cả</button><button type="button" class="loc" aria-pressed="true" id="loc-bat">Đang lỗi</button></div>
<div role="tablist" aria-label="Vệt" class="hang" style="position:relative"><button type="button" role="tab" aria-selected="true" class="tab-vet" id="tab-vet">Ngày</button><button type="button" role="tab" aria-selected="false" class="tab-vet">Tuần</button><span class="vet"></span></div>
</main>
</body>
</html>
