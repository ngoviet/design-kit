<!doctype html>
<html lang="vi" data-dk="dem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: ô gõ chữ cỡ nhỏ ở khổ điện thoại</title>
<link rel="stylesheet" href="../../tokens/fonts-local.css">
<link rel="stylesheet" href="../../tokens/core.css">
<link rel="stylesheet" href="../../tokens/dem.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-body)/var(--lh-body) var(--font-body); }
  main { max-width: 40rem; margin: 0 auto; padding: var(--sp-7) var(--sp-4); }
  h1 { font: var(--weight-display) var(--fs-2xl)/var(--lh-tight) var(--font-display); margin: 0 0 var(--sp-4); }
  form { display: grid; gap: var(--sp-4); }
  label { display: grid; gap: var(--sp-1); font-size: var(--fs-sm); }
  input, select, textarea { min-height: var(--hit-lg); padding: 0 var(--sp-3); border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-family: inherit; }
  textarea { padding: var(--sp-2) var(--sp-3); }
  input[type="checkbox"] { width: 24px; min-height: 24px; height: 24px; }
  .tich { display: flex; gap: var(--sp-2); align-items: center; }
  :focus-visible { outline: var(--focus-w) solid var(--focus); outline-offset: 2px; }
  #nho { font-size: 13px; }
  #du { font-size: 16px; }
  #vua { font-size: 15px; }
  #chon-nho { font-size: 14px; }
  #chi-doc { font-size: 13px; }
  #tich { font-size: 12px; }
</style>
</head>
<body>
  <main>
    <h1>Đặt lịch giao hàng</h1>
    <form>
      <label>Tên người nhận <input type="text" id="nho" autocomplete="name"></label>
      <label>Thư điện tử <input type="email" id="du" autocomplete="email"></label>
      <label>Ghi chú cho người giao <textarea id="vua" rows="3"></textarea></label>
      <label>Khung giờ <select id="chon-nho"><option>8:00–10:00</option><option>14:00–16:00</option></select></label>
      <label>Mã đơn <input type="text" id="chi-doc" value="BM-0912" readonly></label>
      <label class="tich"><input type="checkbox" id="tich"> Gọi trước khi giao</label>
    </form>
  </main>
</body>
</html>
