<!doctype html>
<!-- Chữ chỉ nằm trong khung cha opacity 0 (trang đợi JS hiện ra, nhưng tải dữ liệu hỏng và lỗi đã bị bắt).
     Màn hình trống, nên cổng phải báo render dù chữ con có opacity 1. -->
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khung cha trong suốt</title>
</head>
<body>
  <main style="opacity:0">
    <h1>Bảng điều khiển</h1>
    <p>Nội dung này không ai nhìn thấy.</p>
  </main>
</body>
</html>
