<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus gần như không đổi gì</title>
<style>
body { margin: 0; font: 400 1rem/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
main { padding: 24px 16px; max-width: 40rem; display: grid; gap: 16px; justify-items: start; }
a, button, input { font: inherit; min-height: 44px; outline: none; }
button, input { border: 1px solid #999; background: #fff; color: #1a1a1a; padding: 0 12px; }
#mau-sat:focus { background: #fafafa; border-color: #949494; color: #222; }
#nua-px { position: relative; }
#nua-px::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px; background: #555; }
#nua-px:focus::after { height: 2.4px; }
#bong-trong:focus { box-shadow: 0 0 0 0 rgb(0 0 0 / 0), 0 0 0 4px rgb(0 0 0 / 0.01); }
#trang-tren-trang:focus { outline: 3px solid #fff; }
#trong-suot { border-color: transparent; }
#trong-suot:focus { border-width: 3px; }
#gia-rong { position: relative; color: #1a1a1a; }
#gia-rong::after { content: ""; position: absolute; width: 0; height: 2px; background: #0b57d0; }
#gia-rong:focus::after { width: 0.4px; opacity: 0.5; }
#gia-trong::before { content: ""; position: absolute; width: 40px; height: 4px; }
#gia-trong:focus::before { transform: scale(2); }
.nhom { padding: 8px; display: flex; gap: 8px; }
.nhom:focus-within { background: #d2e3fc; }
#dap { animation: dap 700ms infinite alternate; }
@keyframes dap { to { background: #0b57d0; } }
.o { position: relative; display: inline-flex; gap: 8px; align-items: center; min-height: 44px; }
.o input { position: absolute; opacity: 0; width: 24px; height: 24px; min-height: 0; margin: 0; }
.o input:focus { background: #0b57d0; border-width: 4px; outline: auto; }
.mo0 { opacity: 0; position: absolute; }
.mo0 input:focus { background: #0b57d0; border-width: 4px; }
.o .hinh { width: 24px; height: 24px; border: 1px solid #999; }
</style>
</head>
<body>
<main>
<h1>Kiểu focus</h1>
<button type="button" id="khong">Không đổi gì</button>
<button type="button" id="mau-sat">Màu gần như cũ</button>
<button type="button" id="nua-px">Dày thêm 0,4px</button>
<button type="button" id="bong-trong">Bóng trong suốt</button>
<button type="button" id="trang-tren-trang">Vòng trắng trên nền trắng</button>
<button type="button" id="trong-suot">Viền trong suốt dày lên</button>
<a href="#g" id="gia-rong">Phần tử giả vẫn rỗng</a>
<button type="button" id="gia-trong">Phần tử giả không vẽ gì</button>
<div class="nhom"><button type="button" id="nhom-1">Một</button><button type="button" id="nhom-2">Hai</button></div>
<button type="button" id="dap">Nền tự nhấp nháy</button>
<label class="o"><input type="checkbox" id="o-tich"><span class="hinh"></span>Ô tích mất dấu</label>
<label class="o"><span class="mo0"><input type="checkbox" id="o-cha-mo" style="opacity:1;position:static"></span><span class="hinh"></span>Ô tích trong khung mờ</label>
</main>
</body>
</html>
