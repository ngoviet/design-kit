<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tự phát tiếng và tự xin quyền</title>
<style>
body { margin: 0; font: 400 1rem/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
main { padding: 24px 16px; max-width: 40rem; }
</style>
</head>
<body>
<main><h1>Bài nghe</h1>
<audio id="nen" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" autoplay></audio>
<p>Trang này kêu và xin quyền ngay khi mở.</p></main>
<script>
  new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play().catch(() => {});
  const c = new AudioContext();
  const o = c.createOscillator();
  o.connect(c.destination);
  o.start();
  speechSynthesis.speak(new SpeechSynthesisUtterance("xin chào"));
  navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {});
  Notification.requestPermission();
  setTimeout(() => navigator.geolocation.getCurrentPosition(() => {}, () => {}), 200);
</script>
</body>
</html>
