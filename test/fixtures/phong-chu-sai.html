<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chữ không theo người đọc</title>
<style>
body { margin: 0; font: 400 1rem/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
main { padding: 24px 16px; max-width: 40rem; }
p.px { font-size: 16px; }
h1 { font-size: 4vw; line-height: 1.3; }
.hop { height: 1.6em; overflow: hidden; width: 11em; font-size: 1rem; }
.cap { font-size: 1rem; width: 17em; height: 3.4em; overflow: hidden; }
</style>
</head>
<body>
<main><h1>Tiêu đề theo bề rộng màn</h1>
<p class="px">Đoạn văn này đặt cỡ chữ bằng px nên đứng yên khi người đọc chọn chữ to trong cài đặt.</p>
<p class="px">Đoạn văn thứ hai cũng đặt bằng px, cùng một lỗi, chỉ báo một dòng.</p>
<div class="hop" id="hop-vua">Vừa khít một dòng</div>
<div class="cap" id="hop-hai-dong">Chữ vừa đủ hai dòng khi chưa giãn, giãn ra là mất dòng cuối.</div>
</main>
</body>
</html>
