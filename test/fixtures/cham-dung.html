<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đích chạm đủ lớn</title>
<style>
body { margin: 0; font: 400 1rem/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
main { padding: 24px 16px; max-width: 40rem; }
button { font: inherit; border: 1px solid #555; background: #fff; min-height: 44px; min-width: 44px; padding: 0 16px; }
.no { min-height: 0; min-width: 0; width: 28px; height: 28px; padding: 0; position: relative; margin: 16px; }
.no::after { content: ""; position: absolute; inset: -9px; }
label { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; gap: 8px; }
.an { display: none; }
.khoa { min-height: 20px; height: 20px; min-width: 0; padding: 0 4px; }
</style>
</head>
<body>
<main><h1>Điều khiển</h1>
<button type="button">Lưu</button>
<button type="button" class="no" id="no-rong" aria-label="Đóng">×</button>
<label><input type="checkbox" id="trong-nhan"> Nhớ tôi</label>
<p>Đọc thêm trong <a href="#x" id="giua-cau">hướng dẫn sử dụng</a> trước khi bắt đầu.</p>
<p style="display:flex;align-items:center;gap:8px"><button type="button" role="checkbox" aria-checked="false" id="tu-lam" style="min-height:0;min-width:0;width:24px;height:24px;padding:0"></button><label for="tu-lam">Nhớ tôi ở máy này</label></p>
<button type="button" class="khoa" disabled>Chưa dùng được</button>
<button type="button" class="an">Đang ẩn</button>
</main>
</body>
</html>
