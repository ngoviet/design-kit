<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chữ hiện dần khi cuộn, đúng cách</title>
<style>body { margin: 0; font: 400 16px/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; } main { max-width: 40rem; margin: 0 auto; padding: 32px 16px; }
  section { min-height: 90vh; padding: 24px 0; }
  .reveal { opacity: 0; transition: opacity .4s; }
  .reveal.in { opacity: 1; }
  .meo { position: absolute; opacity: 0; background: #222; color: #fff; padding: 4px 8px; }
  .co-meo { position: relative; }
  .co-meo:hover .meo { opacity: 1; }
</style>
</head>
<body>
  <main>
    <h1>Câu chuyện của tiệm</h1>
    <p class="co-meo">Rê chuột để xem mẹo <span class="meo">Mẹo chỉ hiện khi rê chuột</span></p>
    <section><h2 class="reveal" id="phan-1">Khởi đầu từ một gian bếp nhỏ</h2><p class="reveal">Năm 2015, tiệm mở cửa với ba chiếc bàn.</p></section>
    <section><h2 class="reveal" id="phan-2">Mười năm sau</h2><p class="reveal">Tiệm đã có năm chi nhánh.</p></section>
  </main>
  <script>
    // Luôn gắn lớp "in" khi phần tử vào màn; giảm chuyển động chỉ tắt hiệu ứng, không giấu chữ.
    {
      const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add("in")));
      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
    }
  </script>
</body>
</html>
