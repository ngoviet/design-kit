<!doctype html>
<html lang="vi" data-dk="dem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khối: khung ứng dụng có thanh bên</title>
<script>(()=>{const q=new URLSearchParams(location.search),d=document.documentElement,k=q.get("dk"),t=q.get("theme");if(k&&/^(dem|giay|dam)$/.test(k))d.dataset.dk=k;if(t==="light"||t==="dark")d.dataset.theme=t;})();</script>
<link rel="stylesheet" href="../../tokens/fonts-local.css">
<link rel="stylesheet" href="../../tokens/core.css">
<link rel="stylesheet" href="../../tokens/dem.css">
<link rel="stylesheet" href="../../tokens/giay.css">
<link rel="stylesheet" href="../../tokens/dam.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* ---- Khối: khung ứng dụng (thanh bên cố định ở màn rộng, ngăn kéo <dialog> ở màn hẹp) ---- */
  .shell { min-height: 100dvh; display: grid; grid-template-columns: 1fr; }
  @media (min-width: 60rem) { .shell { grid-template-columns: 16rem minmax(0, 1fr); } }
  .side { background: var(--surface); border-right: 1px solid var(--border); padding: var(--sp-4) var(--sp-3); display: none; }
  @media (min-width: 60rem) { .side { display: block; position: sticky; top: 0; height: 100dvh; overflow-y: auto; } }
  .side .brand { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3) var(--sp-4); font: 700 var(--fs-base)/1 var(--font-display); }
  .side .brand svg { width: 24px; height: 24px; color: var(--accent); }
  .group + .group { margin-top: var(--sp-4); }
  .group h2 { font: 600 var(--fs-xs)/1.5 var(--font-ui, var(--font-body)); color: var(--text-2); letter-spacing: 0; padding: 0 var(--sp-3); margin-bottom: var(--sp-1); }
  .group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .group a { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--hit); padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--text-2); text-decoration: none; font: 500 var(--fs-sm)/1.2 var(--font-ui, var(--font-body)); }
  .group a svg { width: 18px; height: 18px; flex: none; }
  .group a:hover { background: var(--surface-2); color: var(--text); }
  .group a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
  .main { min-width: 0; }
  .topbar { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 2; }
  .topbar h1 { font-size: var(--fs-md); letter-spacing: 0; }
  @media (min-width: 60rem) { .open-side { display: none; } .topbar { padding-inline: var(--sp-6); } }
  .content { padding: var(--sp-6) var(--sp-4); max-width: 60rem; }
  @media (min-width: 60rem) { .content { padding-inline: var(--sp-6); } }
  .content p { color: var(--text-2); }
  .drawer { margin: 0; width: min(18rem, 85vw); height: 100dvh; max-height: none; padding: var(--sp-4) var(--sp-3); border: 0; border-right: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .drawer::backdrop { background: oklch(0.15 0.01 250 / 0.5); }
  .drawer .close { margin-left: auto; display: flex; }
  @media (prefers-reduced-motion: no-preference) {
    .drawer[open] { animation: keo var(--dur-2) var(--ease-out); }
    @keyframes keo { from { transform: translateX(-100%); } }
  }
</style>
</head>
<body>
  <!-- KHỐI BẮT ĐẦU: thanh-ben -->
  <template id="nav-tpl">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 7.5v4M12 11.5 6.5 16M12 11.5l5.5 4.5"/></svg>Mạng nhà</div>
    <div class="group"><h2>Theo dõi</h2><ul>
      <li><a href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Tổng quan</a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>Thiết bị</a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 4"/></svg>Lưu lượng</a></li>
    </ul></div>
    <div class="group"><h2>Quản lý</h2><ul>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a6 6 0 0 1 6 6v4l2 3H4l2-3V9a6 6 0 0 1 6-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>Cảnh báo</a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Cài đặt</a></li>
    </ul></div>
  </template>
  <div class="shell">
    <aside class="side" aria-label="Điều hướng chính"><nav id="side-nav"></nav></aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon open-side" type="button" aria-label="Mở điều hướng" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1>Tổng quan</h1>
      </header>
      <main class="content" id="noi-dung">
        <p>Màn rộng hơn 60rem: thanh bên luôn hiện và dính theo chiều cao màn hình. Màn hẹp: nút ở đầu trang mở ngăn kéo bằng <code>&lt;dialog&gt;</code>. Ngăn kéo tự giữ focus bên trong, đóng bằng Esc và trả focus về nút.</p>
      </main>
    </div>
  </div>
  <dialog class="drawer" id="drawer" aria-label="Điều hướng">
    <button class="btn btn-ghost btn-icon close" type="button" aria-label="Đóng điều hướng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <nav id="drawer-nav"></nav>
  </dialog>
  <!-- KHỐI KẾT THÚC: thanh-ben -->
  <script>
    const tpl = document.getElementById("nav-tpl").content;
    document.getElementById("side-nav").append(tpl.cloneNode(true));
    document.getElementById("drawer-nav").append(tpl.cloneNode(true));
    const dr = document.getElementById("drawer");
    document.querySelector(".open-side").addEventListener("click", () => dr.showModal());
    dr.querySelector(".close").addEventListener("click", () => dr.close());
    dr.addEventListener("click", (e) => { if (e.target === dr) dr.close(); });
  </script>
</body>
</html>
