<!doctype html>
<html lang="vi" data-dk="dem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khối: trạng thái rỗng, đang tải, lỗi, không có quyền</title>
<script>(()=>{const q=new URLSearchParams(location.search),d=document.documentElement,k=q.get("dk"),t=q.get("theme");if(k&&/^(dem|giay|dam)$/.test(k))d.dataset.dk=k;if(t==="light"||t==="dark")d.dataset.theme=t;})();</script>
<link rel="stylesheet" href="../../tokens/fonts.css">
<link rel="stylesheet" href="../../tokens/core.css">
<link rel="stylesheet" href="../../tokens/dem.css">
<link rel="stylesheet" href="../../tokens/giay.css">
<link rel="stylesheet" href="../../tokens/dam.css">
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; gap: var(--sp-5); grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); }
  .grid > figure { margin: 0; display: grid; grid-template-rows: auto 1fr; gap: var(--sp-2); }
  .grid > figure > figcaption { font: 600 var(--fs-xs)/1.5 var(--font-ui, var(--font-body)); color: var(--text-2); }

  /* ---- Khối: trạng thái của một vùng dữ liệu ---- */
  .state { min-height: 16rem; padding: var(--sp-6) var(--sp-5); display: grid; align-content: center; justify-items: start; gap: var(--sp-3); }
  .state > svg { width: 28px; height: 28px; color: var(--text-2); }
  .state h2 { font-size: var(--fs-md); letter-spacing: 0; line-height: var(--lh-snug); }
  .state p { margin: 0; color: var(--text-2); }
  .state .actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
  .state.is-error > svg { color: var(--bad); }
  .state code { font: 400 var(--fs-xs)/1.5 var(--font-mono); color: var(--text-2); background: var(--surface-2); padding: 2px var(--sp-2); border-radius: var(--r-sm); }

  /* Đang tải: khung xương đúng hình nội dung thật để không nhảy bố cục (CLS) */
  .state.is-loading { align-content: start; justify-items: stretch; gap: var(--sp-4); }
  .sk-row { display: grid; grid-template-columns: 2.5rem 1fr 4rem; gap: var(--sp-3); align-items: center; }
  .sk { height: 12px; border-radius: var(--r-sm); background: var(--surface-2); }
  .sk.round { width: 2.5rem; height: 2.5rem; border-radius: 50%; }
  .sk.w60 { width: 60%; margin-top: var(--sp-2); }
  @media (prefers-reduced-motion: no-preference) {
    .sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%) 0 0 / 200% 100%; animation: anh 1.4s var(--ease-in-out) infinite; }
    @keyframes anh { to { background-position: -200% 0; } }
  }
</style>
</head>
<body>
  <main class="demo">
    <h1>Bốn trạng thái của một vùng dữ liệu</h1>
    <p class="lede">Mỗi vùng hiện dữ liệu phải có đủ bốn trạng thái. Mỗi trạng thái nói rõ chuyện gì đang xảy ra và người dùng làm gì tiếp theo.</p>

    <div class="grid">
      <figure>
        <figcaption>Rỗng</figcaption>
        <!-- KHỐI BẮT ĐẦU: trang-thai / rong -->
        <section class="state surface" aria-labelledby="rong-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 15h3"/></svg>
          <h2 id="rong-h">Chưa có thiết bị nào</h2>
          <p>Thêm thiết bị đầu tiên để bắt đầu theo dõi lưu lượng và cảnh báo.</p>
          <div class="actions">
            <button class="btn btn-primary" type="button">Thêm thiết bị</button>
            <button class="btn btn-secondary" type="button">Quét mạng tự động</button>
          </div>
        </section>
        <!-- KHỐI KẾT THÚC -->
      </figure>

      <figure>
        <figcaption>Đang tải</figcaption>
        <!-- KHỐI BẮT ĐẦU: trang-thai / dang-tai -->
        <section class="state surface is-loading" aria-busy="true" aria-labelledby="tai-h">
          <h2 id="tai-h" class="sr-only">Đang tải danh sách thiết bị</h2>
          <div class="sk-row" aria-hidden="true"><span class="sk round"></span><span><span class="sk" style="display:block"></span><span class="sk w60" style="display:block"></span></span><span class="sk"></span></div>
          <div class="sk-row" aria-hidden="true"><span class="sk round"></span><span><span class="sk" style="display:block"></span><span class="sk w60" style="display:block"></span></span><span class="sk"></span></div>
          <div class="sk-row" aria-hidden="true"><span class="sk round"></span><span><span class="sk" style="display:block"></span><span class="sk w60" style="display:block"></span></span><span class="sk"></span></div>
          <p class="small" role="status">Đang tải danh sách thiết bị…</p>
        </section>
        <!-- KHỐI KẾT THÚC -->
      </figure>

      <figure>
        <figcaption>Lỗi</figcaption>
        <!-- KHỐI BẮT ĐẦU: trang-thai / loi -->
        <section class="state surface is-error" aria-labelledby="loi-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
          <h2 id="loi-h">Không tải được danh sách thiết bị</h2>
          <p>Bộ định tuyến không trả lời sau 10 giây. Kiểm tra bộ định tuyến còn bật và cùng mạng với máy này.</p>
          <p><code>ETIMEDOUT 192.168.1.1:443</code></p>
          <div class="actions">
            <button class="btn btn-primary" type="button">Thử lại</button>
            <a class="btn btn-ghost" href="#">Xem nhật ký</a>
          </div>
        </section>
        <!-- KHỐI KẾT THÚC -->
      </figure>

      <figure>
        <figcaption>Không có quyền</figcaption>
        <!-- KHỐI BẮT ĐẦU: trang-thai / khong-quyen -->
        <section class="state surface" aria-labelledby="quyen-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg>
          <h2 id="quyen-h">Bạn chưa có quyền xem mục này</h2>
          <p>Danh sách thiết bị chỉ dành cho quản trị viên. Người quản trị hiện tại là Ngô Việt.</p>
          <div class="actions">
            <button class="btn btn-secondary" type="button">Gửi yêu cầu cấp quyền</button>
          </div>
        </section>
        <!-- KHỐI KẾT THÚC -->
      </figure>
    </div>
  </main>
</body>
</html>
