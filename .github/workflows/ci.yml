# CI trên GitHub Actions (repo public: miễn phí). Trước 10/11/2026 repo riêng tư nên chạy Woodpecker tự host;
# repo public thì không, vì PR từ fork lạ sẽ chạy trên máy chủ riêng.
#
# Đây cũng là phép thử "chạy độc lập": container Linux sạch, không có Edge, không có skill Impeccable.
# Mọi thứ cổng cần phải đến từ repo, npm, hoặc `design-kit setup`.
# Image Playwright có sẵn Node và Chromium, PHẢI cùng phiên bản với playwright-core trong package-lock.json
# (hiện 1.65.1). Nâng playwright-core thì đổi tag image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      # Bản Claude Code mà data/claude-themes.json đã đọc màu theme. Nâng bản thì chạy lại scripts/claude-themes.mjs.
      CLAUDE_CODE_VERSION: 2.1.311
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      # Thiếu `claude` thì test check-mod trượt, không lặng lẽ bỏ qua: xanh phải nghĩa là đã chạy.
      DK_REQUIRE_CLAUDE: "1"
    steps:
      - uses: actions/checkout@v5

      # `npm ci` chạy luôn script prepare (tsup) ⇒ có dist/bin/design-kit.js.
      - name: install
        run: |
          npm ci --no-audit --no-fund
          cd blocks/react && npm ci --no-audit --no-fund

      # Claude Code cho check-mod: `claude plugin validate` và `claude plugin test` chạy mod mẫu test/fixtures/mods/xau
      # ngay trên máy, không gọi model, nên không cần đăng nhập hay khoá API. Gói npm tải bản chạy gốc cho Linux.
      # Đọc lại màu theme từ bản vừa cài: phải khớp data/claude-themes.json đã commit.
      - name: claude code
        run: |
          npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          sha256sum data/claude-themes.json > /tmp/themes.sha
          node scripts/claude-themes.mjs
          sha256sum -c /tmp/themes.sha

      # tsc, eslint, vitest (test chạy trình duyệt thật: ở đây là Chromium của Playwright).
      - name: check
        run: npm run check

      # Token: mọi cặp màu đạt; DESIGN.md sinh từ token phải khớp bản đã commit; lint DESIGN.md.
      - name: tokens
        run: |
          node scripts/kiem-cap-mau.mjs
          sha256sum design/*/DESIGN.md > /tmp/design.sha
          node scripts/tao-design-md.mjs
          sha256sum -c /tmp/design.sha
          npm run lint:design

      # Cổng trên mọi khối, 3 hướng, kể cả trạng thái trong các tệp .steps.json. setup tải engine Impeccable ghim
      # (bản Linux, kiểm sha256) vào ~/.design-kit trong container.
      - name: gate
        run: |
          node dist/bin/design-kit.js setup
          (cd blocks/react && npm run build)
          node dist/bin/design-kit.js check blocks/html blocks/react/dist --query dk=dem,dk=giay,dk=dam --strict --jobs 4 --no-shots
