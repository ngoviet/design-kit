# CI trên Woodpecker tự host (PC4, https://ci.bepmamnon.com), không dùng GitHub Actions (repo riêng tư).
# Chỉ chạy khi repo đã được Enable trong giao diện Woodpecker.
#
# Đây cũng là phép thử "chạy độc lập": container Linux sạch, không có Edge, không có skill impeccable,
# không có ổ D:\code. Mọi thứ cổng cần phải đến từ repo, npm, hoặc `design-kit setup`.
# Image Playwright có sẵn Node và Chromium, PHẢI cùng phiên bản với playwright-core trong package-lock.json
# (hiện 1.65.0). Nâng playwright-core thì đổi tag ở mọi bước.

when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  # `npm ci` chạy luôn script prepare (tsup) ⇒ có dist/bin/design-kit.js.
  - name: install
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    commands:
      - npm ci
      - cd blocks/react && npm ci

  # tsc, eslint, vitest (test chạy trình duyệt thật: ở đây là Chromium của Playwright).
  - name: check
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    commands:
      - npm run check

  # Token: mọi cặp màu đạt; DESIGN.md sinh từ token phải khớp bản đã commit; lint DESIGN.md.
  - name: tokens
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    commands:
      - node scripts/kiem-cap-mau.mjs
      - sha256sum design/*/DESIGN.md > /tmp/design.sha
      - node scripts/tao-design-md.mjs
      - sha256sum -c /tmp/design.sha
      - npm run lint:design

  # Cổng trên mọi khối, 3 hướng, kể cả trạng thái trong các tệp .steps.json. setup tải engine Impeccable ghim
  # (bản Linux, kiểm sha256) vào ~/.design-kit trong container.
  - name: gate
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    commands:
      - node dist/bin/design-kit.js setup
      - cd blocks/react && npm run build && cd ../..
      - node dist/bin/design-kit.js check blocks/html blocks/react/dist --query dk=dem,dk=giay,dk=dam --strict --jobs 4 --no-shots
